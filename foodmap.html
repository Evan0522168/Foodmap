<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>武陵高中路口美食輪盤</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui,"Microsoft JhengHei",sans-serif}

<body>
<header>
  <h1>🏫 武陵高中 路口美食輪盤 🐶</h1>
</header>

<main>
  <div id="map"></div>

  <div class="panel">
    <div>
      <div class="label">起點校門</div>

      <div class="row" style="margin-top:8px">
        <button id="front" class="gate active"
          onclick="selectGate('front')">
          前門・圓環中山路側
        </button>

        <button id="back" class="gate"
          onclick="selectGate('back')">
          後門
        </button>
      </div>

      <div class="row" style="margin-top:8px">
        <button class="small" onclick="setGateOnMap('front')">
          📍 設定前門
        </button>

        <button class="small" onclick="setGateOnMap('back')">
          📍 設定後門
        </button>
      </div>
    </div>

    <div class="card">
      <div class="label">🧭 一次走到下一個路口，不迴轉</div>
      <div class="result" id="direction">尚未轉向</div>
      <div id="position">準備載入道路…</div>

      <button id="move" class="blue" disabled onclick="spinMove()">
        🎲 抽方向並前進
      </button>
    </div>

    <div class="card">
      <div class="label">🍗 美食輪盤・吃的機率 1/3</div>
      <div class="result" id="foodResult">尚未選擇</div>

      <button id="food" class="orange" disabled onclick="spinFood()">
        🍟 轉美食輪盤
      </button>
    </div>

    <div>
      <div class="label">📍 探索紀錄</div>
      <div id="logs" aria-live="polite"></div>
    </div>

    <button onclick="resetGame()">🔄 重置／重試載入</button>

    <div class="row">
      <button class="small"
        onclick="document.getElementById('roadFile').click()">
        📂 匯入道路
      </button>

      <button class="small" onclick="backupRoads()">
        💾 備份道路
      </button>
    </div>

    <input id="roadFile" type="file" accept=".json,.osm,.xml" hidden>

    <p class="note">
      版本 8。校內道路排除，同一路口附近的岔路合併；
      禁止原路迴轉。保留吉昌街與中山路847巷，排除上海路。
      中山路可沿路走，但不可跨到學校對側。
      校門及限制依 OSM 圖資判定，可按「設定」後點地圖校正。
      道路備份檔 wuling-roads.json 可與本頁放在 GitHub 同一資料夾。
      地圖底圖與首次下載仍需網路。
    </p>
  </div>
</main>

<div class="modal" id="modal" role="dialog"
  aria-modal="true" aria-label="美食輪盤結果">
  <div class="modal-box">
    <h2>🎉 在附近找美食！</h2>
    <p id="foodDescription"></p>
    <button class="orange" onclick="closeModal()">準備開吃 😋</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
'use strict';

const $ = id => document.getElementById(id);

const CACHE_KEY = 'wuling-roads-v6';
const GATE_KEY = 'wuling-gates-v6';
const MERGE_DISTANCE = 25;

const ROAD_SERVERS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter'
];

const gates = {
  front: {
    name: '前門・圓環中山路側',
    coords: null
  },
  back: {
    name: '後門',
    coords: [24.9877, 121.2862]
  }
};

try {
  const saved = JSON.parse(
    localStorage.getItem(GATE_KEY) || '{}'
  );

  for (const key of ['front', 'back']) {
    if (
      Array.isArray(saved[key]) &&
      saved[key].length === 2 &&
      saved[key].every(Number.isFinite)
    ) {
      gates[key].coords = saved[key];
    }
  }
} catch (_) {}

let map, dog, trail;
let pointLayer, campusLayer, gateLayer, foodLayer;

let rawData = null;
let streets = new Map();
let graph = new Map();
let startRoutes = [];

let protectedJunctions = new Set();
let terminalNodes = new Set();

let selectedGate = 'front';
let settingGate = null;
let currentId;
let previousEdge = null;

let arrived = false;
let steps = 0;
let history = [];
let phase = 'loading';

let version = 0;
let animationFrame = 0;
let spinTimer = 0;
let requestController;

function log(text) {
  const item = document.createElement('div');
  item.className = 'log';
  item.textContent = text;
  $('logs').prepend(item);
}

function state(value) {
  phase = value;
  $('move').disabled = value !== 'idle';
  $('food').disabled = value !== 'idle';
}

function cancel() {
  version++;
  clearTimeout(spinTimer);
  cancelAnimationFrame(animationFrame);
  requestController?.abort();
  requestController = undefined;
}

function meters(a, b) {
  const r = Math.PI / 180;

  return 6371000 * Math.hypot(
    (b[0] - a[0]) * r,
    (b[1] - a[1]) * r *
      Math.cos((a[0] + b[0]) / 2 * r)
  );
}

function pathLength(points) {
  let total = 0;

  for (let i = 1; i < points.length; i++) {
    total += meters(points[i - 1], points[i]);
  }

  return total;
}

function xy(p) {
  return [
    (p[1] - 121.285) * 100800,
    (p[0] - 24.989) * 111200
  ];
}

function cross(a, b, p) {
  return (
    (b[0] - a[0]) * (p[1] - a[1]) -
    (b[1] - a[1]) * (p[0] - a[0])
  );
}

function crosses(a, b, c, d) {
  return (
    cross(a, b, c) * cross(a, b, d) < 0 &&
    cross(c, d, a) * cross(c, d, b) < 0
  );
}

function inside(p, ring) {
  let yes = false;

  for (
    let i = 0, j = ring.length - 1;
    i < ring.length;
    j = i++
  ) {
    const a = ring[i];
    const b = ring[j];

    if (
      (a[0] > p[0]) !== (b[0] > p[0]) &&
      p[1] <
        (b[1] - a[1]) * (p[0] - a[0]) /
        (b[0] - a[0]) + a[1]
    ) {
      yes = !yes;
    }
  }

  return yes;
}

function nearestSegment(p, segments) {
  const q = xy(p);
  let best;

  for (const [a, b] of segments) {
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const squared = dx * dx + dy * dy;

    if (!squared) continue;

    const t = Math.max(
      0,
      Math.min(
        1,
        (
          (q[0] - a[0]) * dx +
          (q[1] - a[1]) * dy
        ) / squared
      )
    );

    const foot = [
      a[0] + t * dx,
      a[1] + t * dy
    ];

    const distance = Math.hypot(
      q[0] - foot[0],
      q[1] - foot[1]
    );

    if (!best || distance < best.distance) {
      best = {
        a, b, foot, distance,
        length: Math.sqrt(squared)
      };
    }
  }

  return best;
}

function validData(data) {
  return (
    Array.isArray(data?.elements) &&
    data.elements.some(e => e.type === 'node') &&
    data.elements.some(
      e => e.type === 'way' && e.tags?.highway
    ) &&
    data.elements.some(
      e =>
        e.tags?.amenity === 'school' &&
        /武陵/.test(e.tags?.name || '')
    )
  );
}

function parseData(text) {
  if (text.trim().startsWith('{')) {
    const data = JSON.parse(text);

    if (data.remark || !validData(data)) {
      throw new Error('缺少武陵高中校地或道路資料');
    }

    return data;
  }

  const xml = new DOMParser().parseFromString(
    text, 'application/xml'
  );

  if (
    xml.querySelector('parsererror') ||
    xml.documentElement.localName !== 'osm'
  ) {
    throw new Error('不是有效的道路 JSON 或 OSM XML');
  }

  const elements = [];

  for (const element of xml.documentElement.children) {
    const type = element.localName;
    const id = Number(element.getAttribute('id'));

    const tags = Object.fromEntries(
      [...element.children]
        .filter(t => t.localName === 'tag')
        .map(t => [
          t.getAttribute('k'),
          t.getAttribute('v')
        ])
    );

    if (type === 'node') {
      elements.push({
        type, id, tags,
        lat: Number(element.getAttribute('lat')),
        lon: Number(element.getAttribute('lon'))
      });
    }

    if (type === 'way') {
      elements.push({
        type, id, tags,
        nodes: [...element.children]
          .filter(t => t.localName === 'nd')
          .map(t => Number(t.getAttribute('ref')))
      });
    }

    if (type === 'relation') {
      elements.push({
        type, id, tags,
        members: [...element.children]
          .filter(t => t.localName === 'member')
          .map(t => ({
            type: t.getAttribute('type'),
            ref: Number(t.getAttribute('ref')),
            role: t.getAttribute('role')
          }))
      });
    }
  }

  const data = { elements };

  if (!validData(data)) {
    throw new Error('檔案未包含武陵高中校地與道路');
  }

  return data;
}

function schoolRings(data) {
  const nodes = new Map(
    data.elements
      .filter(e => e.type === 'node')
      .map(e => [e.id, [e.lat, e.lon]])
  );

  const ways = new Map(
    data.elements
      .filter(e => e.type === 'way')
      .map(e => [e.id, e])
  );

  const isSchool = e =>
    e.tags?.amenity === 'school' &&
    /武陵/.test(e.tags?.name || '');

  const rings = [];

  function add(ids) {
    if (
      ids.length < 4 ||
      ids[0] !== ids[ids.length - 1]
    ) return;

    const points = ids.map(id => nodes.get(id));

    if (points.every(Boolean)) rings.push(points);
  }

  for (const way of ways.values()) {
    if (isSchool(way)) add(way.nodes || []);
  }

  for (const relation of data.elements) {
    if (
      relation.type !== 'relation' ||
      !isSchool(relation)
    ) continue;

    const parts = (relation.members || [])
      .filter(m =>
        m.type === 'way' &&
        (!m.role || m.role === 'outer')
      )
      .map(m => ways.get(m.ref)?.nodes?.slice())
      .filter(Boolean);

    while (parts.length) {
      const chain = parts.pop();

      while (chain[0] !== chain[chain.length - 1]) {
        const end = chain[chain.length - 1];

        const index = parts.findIndex(p =>
          p[0] === end ||
          p[p.length - 1] === end
        );

        if (index < 0) break;

        const part = parts.splice(index, 1)[0];

        if (part[0] !== end) part.reverse();

        chain.push(...part.slice(1));
      }

      add(chain);
    }
  }

  return rings;
}

function buildRoads(data) {
  const rings = schoolRings(data);

  if (!rings.length) {
    throw new Error('找不到校地邊界，無法排除校內道路');
  }

  const nodes = new Map(
    data.elements
      .filter(e => e.type === 'node')
      .map(e => [
        e.id,
        {
          id: e.id,
          coords: [e.lat, e.lon],
          edges: new Map(),
          names: new Set()
        }
      ])
  );

  protectedJunctions = new Set();
  terminalNodes = new Set();

  const allowed =
    /^(trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|pedestrian|footway|path|steps|road)(_link)?$/;

  const ways = data.elements.filter(e =>
    e.type === 'way' &&
    e.nodes &&
    allowed.test(e.tags?.highway || '') &&
    !['footway', 'path', 'steps'].includes(e.tags?.highway) &&
    !/上海路/.test(e.tags?.name || '') &&
    e.tags.area !== 'yes' &&
    !['private', 'no'].includes(e.tags.access) &&
    e.tags.foot !== 'no'
  );

  for (const way of ways) {
    const name = /江南街/.test(way.tags.name || '')
      ? '道路'
      : way.tags.name || '道路';

    for (let i = 1; i < way.nodes.length; i++) {
      const a = nodes.get(way.nodes[i - 1]);
      const b = nodes.get(way.nodes[i]);

      if (a && b && a.id !== b.id) {
        a.edges.set(b.id, name);
        b.edges.set(a.id, name);

        a.names.add(name);
        b.names.add(name);
      }
    }
  }

  // 保留指定路口，不讓近距離合併把它吞掉。
  for (const node of nodes.values()) {
    const names = [...node.names];

    if (
      names.some(n => /吉昌街/.test(n)) &&
      names.some(n => /中山路.*847巷/.test(n))
    ) {
      node.keep = true;
      node.label = '吉昌街 × 中山路847巷';
      protectedJunctions.add(node.id);
    }
  }

  // 從圖資辨識愛買入口，不新增跨地塊的虛構直線。
  const aimaiWays = data.elements.filter(e =>
    e.type === 'way' &&
    e.nodes &&
    /愛買/.test(
      [e.tags?.name, e.tags?.brand, e.tags?.operator]
        .filter(Boolean)
        .join(' ')
    )
  );

  const poiIds = new Set(
    aimaiWays.flatMap(way => way.nodes)
  );

  const entrancePoints = data.elements
    .filter(e =>
      e.type === 'node' &&
      (
        /愛買/.test(
          [e.tags?.name, e.tags?.brand, e.tags?.operator]
            .filter(Boolean)
            .join(' ')
        ) ||
        (poiIds.has(e.id) && e.tags?.entrance)
      )
    )
    .map(e => [e.lat, e.lon]);

  const namedEntryIds = new Set();

  for (const way of ways) {
    const text = Object.entries(way.tags)
      .filter(([key]) =>
        /name|destination|description/.test(key)
      )
      .map(([, value]) => value)
      .join(' ');

    if (/愛買/.test(text)) {
      for (const id of way.nodes) {
        namedEntryIds.add(id);
      }
    }
  }

  for (const node of nodes.values()) {
    if (
      node.edges.size === 1 &&
      (
        namedEntryIds.has(node.id) ||
        entrancePoints.some(p =>
          meters(p, node.coords) < 35
        )
      )
    ) {
      node.terminal = true;
      node.label = '愛買入口';
      terminalNodes.add(node.id);
    }
  }

  const main = rings
    .reduce((a, b) => a.length > b.length ? a : b)
    .slice(0, -1);

  const center = [0, 1].map(i =>
    main.reduce((sum, p) => sum + p[i], 0) /
    main.length
  );

  const centerXY = xy(center);
  const zhongshan = [];

  for (const way of ways) {
    if (!/中山路/.test(way.tags.name || '')) continue;

    for (let i = 1; i < way.nodes.length; i++) {
      const a = nodes.get(way.nodes[i - 1]);
      const b = nodes.get(way.nodes[i]);

      if (a && b) {
        zhongshan.push([xy(a.coords), xy(b.coords)]);
      }
    }
  }

  if (!zhongshan.length) {
    throw new Error('圖資中找不到中山路');
  }

  if (!gates.front.coords) {
    let best;

    for (const way of ways) {
      if (way.tags.junction !== 'roundabout') continue;

      for (const id of way.nodes) {
        const node = nodes.get(id);
        if (!node) continue;

        const distance = meters(node.coords, center);
        if (distance > 400) continue;

        const road = nearestSegment(
          node.coords, zhongshan
        );

        if (!road || road.distance > 100) continue;

        const score =
          road.distance + distance * 0.1;

        if (!best || score < best.score) {
          best = {
            coords: node.coords,
            score
          };
        }
      }
    }

    if (!best) {
      throw new Error(
        '請按「設定前門」，點選圓環靠中山路側的校外道路'
      );
    }

    gates.front.coords = best.coords;

    log('前門暫依 OSM 圓環定位，可按「設定前門」校正。');
  }

  const front = nearestSegment(
    gates.front.coords, zhongshan
  );

  if (!front || front.distance > 250) {
    throw new Error('前門離中山路過遠，請重新設定前門');
  }

  // 中山路保留學校這側，不進入對側。
  function forbidden(p) {
    const q = xy(p);
    const road = nearestSegment(p, zhongshan);

    const side =
      cross(road.a, road.b, q) / road.length;

    const schoolSide =
      cross(road.a, road.b, centerXY) / road.length;

    return Math.abs(side) > 1 && side * schoolSide < 0;
  }

  for (const [id, node] of nodes) {
    if (
      !node.edges.size ||
      rings.some(r => inside(node.coords, r)) ||
      forbidden(node.coords)
    ) {
      nodes.delete(id);
    }
  }

  for (const node of nodes.values()) {
    for (const id of node.edges.keys()) {
      const target = nodes.get(id);

      if (!target) {
        node.edges.delete(id);
        continue;
      }

      const a = xy(node.coords);
      const b = xy(target.coords);

      const throughCampus = rings.some(ring =>
        ring.slice(1).some((p, i) =>
          crosses(a, b, xy(ring[i]), xy(p))
        )
      );

      const acrossRoad = zhongshan.some(([c, d]) =>
        crosses(a, b, c, d)
      );

      if (throughCampus || acrossRoad) {
        node.edges.delete(id);
      }
    }
  }

  for (const [id, node] of nodes) {
    if (!node.edges.size) nodes.delete(id);
  }

  pruneStreetEnds(nodes);

  return { nodes, rings };
}

function simplifyRoads(nodes) {
  const junctions = new Map(
    [...nodes].filter(([, node]) =>
      node.keep ||
      node.terminal ||
      node.edges.size !== 2
    )
  );

  const corridors = [];
  const used = new Set();

  const edgeKey = (a, b) =>
    a < b ? `${a}:${b}` : `${b}:${a}`;

  for (const [id, node] of junctions) {
    for (const [nextId, name] of node.edges) {
      if (used.has(edgeKey(id, nextId))) continue;

      const ids = [id];
      const seen = new Set([id]);

      let previous = id;
      let next = nextId;

      while (!seen.has(next)) {
        seen.add(next);
        used.add(edgeKey(previous, next));
        ids.push(next);

        const target = nodes.get(next);

        if (
          !target ||
          target.keep ||
          target.terminal ||
          target.edges.size !== 2
        ) break;

        const onward = [...target.edges.keys()]
          .find(value => value !== previous);

        previous = next;
        next = onward;
      }

      const end = ids[ids.length - 1];

      if (!junctions.has(end) || end === id) continue;

      const coords = ids.map(value =>
        nodes.get(value).coords
      );

      corridors.push({
        id: corridors.length,
        a: id,
        b: end,
        name,
        coords,
        length: pathLength(coords)
      });
    }
  }

  const parent = new Map(
    [...junctions.keys()].map(id => [id, id])
  );

  function root(id) {
    if (parent.get(id) !== id) {
      parent.set(id, root(parent.get(id)));
    }

    return parent.get(id);
  }

  for (const corridor of corridors) {
    if (
      !junctions.get(corridor.a).keep &&
      !junctions.get(corridor.b).keep &&
      corridor.length <= MERGE_DISTANCE &&
      junctions.get(corridor.a).edges.size >= 3 &&
      junctions.get(corridor.b).edges.size >= 3
    ) {
      parent.set(
        root(corridor.b),
        root(corridor.a)
      );
    }
  }

  const groups = new Map();

  for (const id of junctions.keys()) {
    const group = root(id);

    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(id);
  }

  const result = new Map();
  const representatives = new Map();

  const internal = new Map(
    [...junctions.keys()].map(id => [id, []])
  );

  for (const [group, members] of groups) {
    const center = [0, 1].map(i =>
      members.reduce(
        (sum, id) => sum + nodes.get(id).coords[i],
        0
      ) / members.length
    );

    const representative = members.reduce((a, b) =>
      meters(nodes.get(a).coords, center) <
      meters(nodes.get(b).coords, center)
        ? a : b
    );

    representatives.set(group, representative);

    result.set(group, {
      id: group,
      coords: nodes.get(representative).coords,
      routes: [],
      keep: members.some(id => nodes.get(id).keep),
      terminal: members.some(id => nodes.get(id).terminal),
      label:
        members
          .map(id => nodes.get(id).label)
          .find(Boolean) || ''
    });
  }

  for (const corridor of corridors) {
    if (root(corridor.a) !== root(corridor.b)) continue;

    internal.get(corridor.a).push({
      to: corridor.b,
      coords: corridor.coords
    });

    internal.get(corridor.b).push({
      to: corridor.a,
      coords: [...corridor.coords].reverse()
    });
  }

  function internalPath(from, to) {
    if (from === to) {
      return [nodes.get(from).coords];
    }

    const queue = [{
      id: from,
      coords: [nodes.get(from).coords]
    }];

    const seen = new Set([from]);

    for (let i = 0; i < queue.length; i++) {
      for (const route of internal.get(queue[i].id) || []) {
        if (seen.has(route.to)) continue;

        const coords = [
          ...queue[i].coords,
          ...route.coords.slice(1)
        ];

        if (route.to === to) return coords;

        seen.add(route.to);
        queue.push({
          id: route.to,
          coords
        });
      }
    }

    throw new Error('路口內部連線不完整');
  }

  for (const corridor of corridors) {
    const a = root(corridor.a);
    const b = root(corridor.b);

    if (a === b) continue;

    const coords = [
      ...internalPath(
        representatives.get(a), corridor.a
      ),
      ...corridor.coords.slice(1),
      ...internalPath(
        corridor.b, representatives.get(b)
      ).slice(1)
    ];

    result.get(a).routes.push({
      edge: corridor.id,
      to: b,
      name: corridor.name,
      coords
    });

    result.get(b).routes.push({
      edge: corridor.id,
      to: a,
      name: corridor.name,
      coords: [...coords].reverse()
    });
  }

  for (const [id, node] of result) {
    if (!node.routes.length) result.delete(id);
  }

  return result;
}

// 清理一般斷頭支線，但保留圖資辨識出的愛買入口。
function pruneStreetEnds(nodes) {
  const queue = [...nodes.values()]
    .filter(node => node.edges.size < 2)
    .map(node => node.id);

  for (let i = 0; i < queue.length; i++) {
    const id = queue[i];
    const node = nodes.get(id);

    if (
      !node ||
      node.terminal ||
      node.edges.size >= 2
    ) continue;

    for (const next of node.edges.keys()) {
      const neighbor = nodes.get(next);
      if (!neighbor) continue;

      neighbor.edges.delete(id);

      if (neighbor.edges.size < 2) {
        queue.push(next);
      }
    }

    nodes.delete(id);
  }
}

// 將只剩前後兩個出口的中間點連續接起來。
function decisionGraph(input) {
  let changed = true;

  while (changed) {
    changed = false;

    for (const [id, node] of input) {
      node.routes = node.routes.filter(route =>
        input.has(route.to)
      );

      if (
        node.routes.length < 2 &&
        !node.terminal
      ) {
        input.delete(id);
        changed = true;
      }
    }
  }

  const result = new Map();

  for (const [id, node] of input) {
    if (
      node.keep ||
      node.terminal ||
      node.routes.length >= 3
    ) {
      result.set(id, {
        id,
        coords: node.coords,
        routes: [],
        label: node.label || '',
        terminal: !!node.terminal
      });
    }
  }

  const used = new Set();
  let serial = 0;

  for (const [id, output] of result) {
    for (const first of input.get(id).routes) {
      if (used.has(first.edge)) continue;

      let route = first;
      let end = first.to;

      const coords = [...first.coords];
      const seen = new Set();

      used.add(first.edge);

      while (!result.has(end)) {
        if (seen.has(end)) {
          end = null;
          break;
        }

        seen.add(end);

        const node = input.get(end);

        if (!node) {
          end = null;
          break;
        }

        const next = node.routes.find(candidate =>
          candidate.edge !== route.edge
        );

        if (!next) {
          end = null;
          break;
        }

        used.add(next.edge);
        coords.push(...next.coords.slice(1));

        route = next;
        end = next.to;
      }

      if (end === null || !result.has(end)) continue;

      const key = serial++;

      output.routes.push({
        edge: key + ':f',
        reverseEdge: key + ':r',
        to: end,
        name: result.get(end).terminal
          ? '愛買入口'
          : first.name,
        coords
      });

      result.get(end).routes.push({
        edge: key + ':r',
        reverseEdge: key + ':f',
        to: id,
        name: result.get(id).terminal
          ? '愛買入口'
          : first.name,
        coords: [...coords].reverse()
      });
    }
  }

  return result;
}

function rebuild() {
  const built = buildRoads(rawData);

  streets = built.nodes;
  graph = decisionGraph(simplifyRoads(streets));

  if (!graph.size) {
    throw new Error(
      '此範圍沒有連通的路口網路，請確認校門位置或道路圖資'
    );
  }

  pointLayer.clearLayers();
  campusLayer.clearLayers();

  for (const ring of built.rings) {
    L.polygon(ring, {
      color: '#ef4444',
      weight: 1,
      fillOpacity: 0.06,
      interactive: false
    }).addTo(campusLayer);
  }

  for (const node of graph.values()) {
    L.circleMarker(node.coords, {
      radius: 5,
      color: '#fbbf24',
      weight: 1,
      fillOpacity: 0.9
    })
      .bindTooltip(node.label || '路口')
      .addTo(pointLayer);
  }

  gateLayer.clearLayers();

  for (const key of ['front', 'back']) {
    if (!gates[key].coords) continue;

    L.marker(gates[key].coords, {
      icon: L.divIcon({
        className: 'dog',
        html: '🏫',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      })
    })
      .bindTooltip(gates[key].name)
      .addTo(gateLayer);
  }
}

function start() {
  const gate = gates[selectedGate];

  if (!gate.coords) {
    throw new Error('請先設定校門');
  }

  let nearest;
  let best = Infinity;

  for (const node of streets.values()) {
    const distance = meters(gate.coords, node.coords);

    if (distance < best) {
      best = distance;
      nearest = node;
    }
  }

  if (!nearest || best > 200) {
    throw new Error(
      '校門附近找不到可行校外道路，請重新設定校門'
    );
  }

  const exact = [...graph.values()].find(node =>
    meters(node.coords, nearest.coords) < 0.2
  );

  startRoutes = [];
  currentId = undefined;
  arrived = false;

  if (exact) {
    currentId = exact.id;
    arrived = true;
  } else {
    for (const node of graph.values()) {
      for (const route of node.routes) {
        const index = route.coords.findIndex(p =>
          meters(p, nearest.coords) < 0.2
        );

        if (index < 0) continue;

        const coords = route.coords.slice(index);

        if (
          coords.length < 2 ||
          pathLength(coords) < 0.5
        ) continue;

        if (
          !startRoutes.some(candidate =>
            candidate.edge === route.edge &&
            candidate.to === route.to
          )
        ) {
          startRoutes.push({
            ...route,
            coords
          });
        }
      }
    }
  }

  if (!arrived && !startRoutes.length) {
    throw new Error(
      '校門附近道路未連到可用路口，請把校門設在校外道路上'
    );
  }

  previousEdge = null;
  steps = 0;
  history = [nearest.coords];

  dog.setLatLng(nearest.coords);
  trail.setLatLngs(history);
  map.setView(nearest.coords, 17);

  updatePosition();
  state('idle');

  log(
    `${gate.name}出發，對齊校外道路約 ` +
    `${Math.round(best)} 公尺。`
  );

  log('✅ 上海路已排除；具名巷道與愛買入口通道保留。');

  log(
    protectedJunctions.size
      ? '✅ 已辨識吉昌街 × 中山路847巷，保留為獨立路口。'
      : '⚠️ 本份圖資未辨識出吉昌街 × 中山路847巷的共同節點。'
  );

  log(
    [...graph.values()].some(node => node.terminal)
      ? '✅ 已辨識愛買入口。'
      : '⚠️ 本份圖資未標出可連通的愛買入口，沒有虛構入口連線。'
  );
}

function cacheData() {
  try {
    localStorage.setItem(
      CACHE_KEY, JSON.stringify(rawData)
    );
  } catch (_) {
    log('瀏覽器無法保存道路資料，請下載備份。');
  }
}

async function fetchSource(source, token) {
  const controller = new AbortController();

  requestController = controller;

  const timeout = setTimeout(
    () => controller.abort(),
    source.timeout || 18000
  );

  try {
    const response = await fetch(source.url, {
      method: source.body ? 'POST' : 'GET',
      ...(source.body ? { body: source.body } : {}),
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const text = await response.text();

    if (token !== version) return null;

    return parseData(text);
  } finally {
    clearTimeout(timeout);

    if (requestController === controller) {
      requestController = undefined;
    }
  }
}

async function loadData(token) {
  if (rawData) return;

  try {
    const cached = JSON.parse(
      localStorage.getItem(CACHE_KEY) || 'null'
    );

    if (validData(cached)) {
      rawData = cached;
      log('✅ 使用已儲存的道路資料。');
      return;
    }
  } catch (_) {}

  const query = `
    [out:json][timeout:15];
    (
      way
        ["highway"~"^(trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|pedestrian|footway|path|steps|road)(_link)?$"]
        ["area"!="yes"]
        ["access"!~"^(private|no)$"]
        ["foot"!="no"]
        (around:1800,24.989,121.285);

      nwr
        ["amenity"="school"]
        ["name"~"武陵"]
        (around:1800,24.989,121.285);

      nwr
        ["name"~"愛買"]
        (around:1800,24.989,121.285);
    );
    (._;>;);
    out body;
  `;

  const sources = [
    {
      name: 'GitHub 同資料夾的道路檔',
      url: new URL(
        './wuling-roads.json', document.baseURI
      ).href,
      timeout: 6000
    },
    {
      name: 'OpenStreetMap 主站',
      url:
        'https://api.openstreetmap.org/api/0.6/map' +
        '?bbox=121.276,24.982,121.294,24.999',
      timeout: 22000
    },
    ...ROAD_SERVERS.map((url, index) => ({
      name: `道路服務 ${index + 1}`,
      url,
      body: new URLSearchParams({ data: query }),
      timeout: 20000
    }))
  ];

  for (const source of sources) {
    if (token !== version) return;

    $('position').textContent =
      '正在讀取：' + source.name;

    let data;

    try {
      data = await fetchSource(source, token);
    } catch (error) {
      if (token !== version) return;

      log(
        `⚠️ ${source.name}：` +
        (
          error.name === 'AbortError'
            ? '連線逾時'
            : error.message
        )
      );

      continue;
    }

    if (token !== version || !data) return;

    rawData = data;
    cacheData();

    log('✅ 已取得道路資料。建議下載備份。');
    return;
  }

  throw new Error(
    '無法取得道路資料。請匯入道路 JSON／OSM，' +
    '或將 wuling-roads.json 放進 GitHub 同一資料夾'
  );
}

async function resetGame() {
  if (!map) return;

  cancel();

  settingGate = null;
  map.getContainer().style.cursor = '';

  const token = version;
  state('loading');

  $('modal').style.display = 'none';
  $('direction').textContent = '尚未轉向';
  $('foodResult').textContent = '尚未選擇';
  $('logs').replaceChildren();

  foodLayer.clearLayers();
  trail.setLatLngs([]);

  try {
    await loadData(token);

    if (token !== version) return;

    rebuild();
    start();
  } catch (error) {
    if (token !== version) return;

    state('error');

    $('position').textContent = error.message;
    log('❌ ' + error.message);
  }
}

function selectGate(key) {
  selectedGate = key;

  $('front').classList.toggle('active', key === 'front');
  $('back').classList.toggle('active', key === 'back');

  resetGame();
}

function setGateOnMap(key) {
  if (!map) return;

  cancel();
  settingGate = key;

  state('setting');

  $('modal').style.display = 'none';
  map.getContainer().style.cursor = 'crosshair';

  $('position').textContent =
    `請點選${key === 'front'
      ? '前門圓環靠中山路側'
      : '後門'}的校外道路位置。`;

  log('📍 點地圖設定校門，設定後重新開始。');
}

function updatePosition() {
  const p = dog.getLatLng();

  $('position').textContent =
    `📍 已走 ${steps} 段道路 ` +
    `[${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}]`;
}

function bearing(a, b) {
  return Math.atan2(
    (b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180),
    b[0] - a[0]
  ) * 180 / Math.PI;
}

function turnAngle(route) {
  if (history.length < 2) return null;

  const first = route.coords[0];

  const next = route.coords.find(p =>
    meters(first, p) >= 8
  ) || route.coords[route.coords.length - 1];

  const end = history[history.length - 1];
  let previous = history[history.length - 2];

  for (let i = history.length - 2; i >= 0; i--) {
    previous = history[i];
    if (meters(previous, end) >= 8) break;
  }

  return (
    (
      bearing(first, next) -
      bearing(previous, end) + 540
    ) % 360
  ) - 180;
}

function routeLabel(route) {
  const change = turnAngle(route);

  if (change === null) {
    const first = route.coords[0];

    const next = route.coords.find(p =>
      meters(first, p) >= 8
    ) || route.coords[route.coords.length - 1];

    const direction = ['北', '東', '南', '西'][
      Math.round((bearing(first, next) + 360) / 90) % 4
    ];

    return `${direction}向・${route.name}`;
  }

  const direction =
    Math.abs(change) < 35
      ? '直行'
      : change > 0 ? '右轉' : '左轉';

  return `${direction}・${route.name}`;
}

// 只排除剛走來的反向道路，不按角度刪除正常出口。
function availableRoutes() {
  const routes = arrived
    ? graph.get(currentId)?.routes || []
    : startRoutes;

  return routes.filter(route =>
    (
      route.reverseEdge === undefined
        ? route.edge
        : route.reverseEdge
    ) !== previousEdge
  );
}

function roulette(draw, done, count = 10) {
  const token = version;

  function tick(n) {
    if (token !== version) return;

    draw();

    if (n >= count) {
      done();
    } else {
      spinTimer = setTimeout(
        () => tick(n + 1), 80
      );
    }
  }

  tick(0);
}

function spinMove() {
  if (phase !== 'idle') return;

  const routes = availableRoutes();

  if (!routes.length) {
    $('direction').textContent = '沒有可前進出口';
    $('move').disabled = true;

    log(
      '🛑 沒有其他出口，不迴轉。' +
      '可轉美食輪盤或重置。'
    );

    return;
  }

  state('spinning');

  const pick = () =>
    routes[Math.floor(Math.random() * routes.length)];

  roulette(
    () => {
      $('direction').textContent =
        '🧭 ' + routeLabel(pick());
    },
    () => {
      const route = pick();
      const label = routeLabel(route);

      $('direction').textContent = '🧭 ' + label;

      animate(route, label);
    }
  );
}

function animate(route, label) {
  state('moving');

  const token = version;
  const coords = route.coords;
  const lengths = [0];

  for (let i = 1; i < coords.length; i++) {
    lengths.push(
      lengths[i - 1] +
      meters(coords[i - 1], coords[i])
    );
  }

  const total = lengths[lengths.length - 1];

  const duration = Math.max(
    700, Math.min(6000, total * 10)
  );

  let started;

  function draw(time) {
    if (token !== version) return;

    started ??= time;

    const progress = Math.min(
      1, (time - started) / duration
    );

    const traveled = progress * total;
    let i = 1;

    while (
      i < lengths.length - 1 &&
      lengths[i] < traveled
    ) i++;

    const fraction =
      (traveled - lengths[i - 1]) /
      (lengths[i] - lengths[i - 1] || 1);

    const a = coords[i - 1];
    const b = coords[i];

    const point = [
      a[0] + (b[0] - a[0]) * fraction,
      a[1] + (b[1] - a[1]) * fraction
    ];

    dog.setLatLng(point);

    trail.setLatLngs([
      ...history,
      ...coords.slice(1, i),
      point
    ]);

    if (progress < 1) {
      animationFrame = requestAnimationFrame(draw);
      return;
    }

    history.push(...coords.slice(1));

    currentId = route.to;
    previousEdge = route.edge;
    arrived = true;
    steps++;

    const node = graph.get(currentId);

    dog.setLatLng(node.coords);
    trail.setLatLngs(history);
    map.panTo(node.coords);

    updatePosition();
    state('idle');

    log(
      `第 ${steps} 步：${label}，` +
      '抵達下一個可選方向的路口，停下等待。'
    );

    if (node.terminal) {
      $('move').disabled = true;
      $('direction').textContent = '📍 抵達愛買入口';

      log(
        '✅ 已抵達愛買入口，不往上海路走。' +
        '可轉美食輪盤。'
      );
    } else if (!availableRoutes().length) {
      $('move').disabled = true;

      log(
        '目前圖資沒有其他連通出口，' +
        '可轉美食輪盤或重置。'
      );
    }
  }

  animationFrame = requestAnimationFrame(draw);
}

function spinFood() {
  if (phase !== 'idle') return;

  state('food');

  roulette(
    () => {
      $('foodResult').textContent =
        Math.random() < 1 / 3
          ? '🎉 吃！'
          : '❌ 不吃';
    },
    () => {
      if (Math.floor(Math.random() * 3) !== 0) {
        $('foodResult').textContent = '❌ 不吃';

        state('idle');

        if (
          graph.get(currentId)?.terminal ||
          !availableRoutes().length
        ) {
          $('move').disabled = true;
        }

        log('🍔 不吃。');
        return;
      }

      state('finished');

      $('foodResult').textContent =
        '🎉 在附近找美食！';

      const p = dog.getLatLng();

      L.marker(p, {
        icon: L.divIcon({
          className: 'dog',
          html: '🍕',
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        })
      }).addTo(foodLayer);

      $('foodDescription').textContent =
        `走過 ${steps} 段道路後，` +
        '決定在目前位置附近找美食！' +
        `座標：${p.lat.toFixed(5)}, ` +
        `${p.lng.toFixed(5)}。` +
        '尚未搜尋實際店家。';

      $('modal').style.display = 'flex';
      log('🍔 決定在附近用餐！');
    }
  );
}

function closeModal() {
  $('modal').style.display = 'none';
}

function backupRoads() {
  if (!validData(rawData)) {
    log('尚未取得道路資料，無法備份。');
    return;
  }

  const blob = new Blob(
    [JSON.stringify(rawData)],
    { type: 'application/json' }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'wuling-roads.json';
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importRoads(event) {
  const file = event.target.files[0];

  if (!file) return;

  try {
    const data = parseData(await file.text());

    if (!schoolRings(data).length) {
      throw new Error('檔案的校地邊界不完整');
    }

    cancel();

    rawData = data;
    cacheData();

    await resetGame();
  } catch (error) {
    log('❌ 匯入失敗：' + error.message);
  } finally {
    event.target.value = '';
  }
}

function init() {
  if (typeof L === 'undefined') {
    $('position').textContent =
      '地圖元件載入失敗，請確認網路後重新整理。';
    return;
  }

  map = L.map('map').setView(
    [24.989, 121.285], 17
  );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }
  ).addTo(map);

  campusLayer = L.layerGroup().addTo(map);
  pointLayer = L.layerGroup().addTo(map);
  gateLayer = L.layerGroup().addTo(map);
  foodLayer = L.layerGroup().addTo(map);

  trail = L.polyline([], {
    color: '#3b82f6',
    weight: 5,
    opacity: 0.85
  }).addTo(map);

  dog = L.marker([24.989, 121.285], {
    icon: L.divIcon({
      className: 'dog',
      html: '🐶',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    }),
    zIndexOffset: 1000
  }).addTo(map);

  map.on('click', event => {
    if (!settingGate) return;

    const key = settingGate;

    gates[key].coords = [
      event.latlng.lat,
      event.latlng.lng
    ];

    try {
      localStorage.setItem(
        GATE_KEY,
        JSON.stringify({
          front: gates.front.coords,
          back: gates.back.coords
        })
      );
    } catch (_) {}

    selectGate(key);
  });

  $('roadFile').addEventListener(
    'change', importRoads
  );

  window.addEventListener(
    'resize', () => map.invalidateSize()
  );

  resetGame();
}

window.addEventListener('load', init);
</script>
</body>
</html>
